name: Fix Corrected Delta P2

on:
  push:
    branches:
      - automation/fix-corrected-delta-p2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/claude-input-token-undercount
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply P2 fix and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/proxy/usage/parser.rs')
          s = p.read_text()
          s = s.replace(
              '        let mut input_from_delta = false;\n',
              '        let mut start_input_tokens = 0u32;\n        let mut delta_only_mode = false;\n'
          )
          s = s.replace(
              '                                usage.input_tokens = input as u32;\n',
              '                                usage.input_tokens = input as u32;\n                                start_input_tokens = input as u32;\n                                delta_only_mode = input == 0;\n',
              1,
          )
          old = '''                                let corrected_cache_tuple = has_delta_cache
                                    && input < usage.input_tokens
                                    && (fresh_plus_cache_read == Some(usage.input_tokens)
                                        || fresh_plus_all_cache == Some(usage.input_tokens));

                                let should_use_delta_input = input > 0
                                    && (usage.input_tokens == 0
                                        || input_from_delta
                                        || corrected_cache_tuple);

                                if should_use_delta_input {
                                    usage.input_tokens = input;
                                    input_from_delta = true;
'''
          new = '''                                let corrected_cache_tuple = has_delta_cache
                                    && start_input_tokens > 0
                                    && input < start_input_tokens
                                    && (fresh_plus_cache_read == Some(start_input_tokens)
                                        || fresh_plus_all_cache == Some(start_input_tokens));

                                let should_use_delta_input =
                                    input > 0 && (delta_only_mode || corrected_cache_tuple);

                                if should_use_delta_input {
                                    usage.input_tokens = input;
'''
          if old not in s:
              raise SystemExit('target parser block not found')
          s = s.replace(old, new, 1)
          marker = '''    #[test]
    fn test_claude_stream_updates_delta_only_usage_from_later_delta() {
'''
          test = '''    #[test]
    fn test_claude_stream_rejects_incoherent_later_delta_after_correction() {
        let events = vec![
            json!({
                "type": "message_start",
                "message": {
                    "model": "qwen-max",
                    "usage": {
                        "input_tokens": 200_000,
                        "cache_read_input_tokens": 180_000,
                        "cache_creation_input_tokens": 2_000
                    }
                }
            }),
            json!({
                "type": "message_delta",
                "usage": {
                    "input_tokens": 80_000,
                    "output_tokens": 100,
                    "cache_read_input_tokens": 120_000,
                    "cache_creation_input_tokens": 500
                }
            }),
            json!({
                "type": "message_delta",
                "usage": {
                    "input_tokens": 200_000,
                    "output_tokens": 1_000,
                    "cache_read_input_tokens": 120_000,
                    "cache_creation_input_tokens": 500
                }
            }),
        ];

        let usage = TokenUsage::from_claude_stream_events(&events).unwrap();
        assert_eq!(usage.input_tokens, 80_000);
        assert_eq!(usage.output_tokens, 1_000);
        assert_eq!(usage.cache_read_tokens, 120_000);
        assert_eq!(usage.cache_creation_tokens, 500);
        assert_eq!(usage.model, Some("qwen-max".to_string()));
    }

'''
          if marker not in s:
              raise SystemExit('test insertion marker not found')
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/proxy/usage/parser.rs
          git commit -m "fix(usage): revalidate corrected Claude deltas"
          git push origin HEAD:fix/claude-input-token-undercount
