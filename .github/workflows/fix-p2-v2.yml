name: Fix P2 v2

on:
  push:
    branches:
      - automation/fix-p2-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/claude-input-token-undercount
          fetch-depth: 0

      - name: Checkout automation script
        uses: actions/checkout@v6
        with:
          ref: automation/fix-p2-v2
          path: automation-src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply fix
        run: python3 automation-src/scripts/apply_cache_creation_fix.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/proxy/usage/parser.rs
          git commit -m "fix(usage): validate cache creation in Claude deltas"
          git push origin HEAD:fix/claude-input-token-undercount
