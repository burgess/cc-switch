name: Patch Claude Delta State Validation Once

on:
  push:
    branches:
      - automation/rustfmt-once

permissions:
  contents: write

jobs:
  patch-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/claude-input-token-undercount
          fetch-depth: 0

      - name: Checkout patch script
        uses: actions/checkout@v6
        with:
          ref: automation/rustfmt-once
          path: .automation

      - name: Patch parser and regression tests
        run: python3 .automation/scripts/patch-delta-only-cache.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit parser fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/proxy/usage/parser.rs
          git commit -m "fix(usage): validate Claude delta usage state"
          git push origin HEAD:fix/claude-input-token-undercount
