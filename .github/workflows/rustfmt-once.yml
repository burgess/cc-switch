name: Patch Claude Zero-Input Cache Fallback Once

on:
  push:
    branches:
      - automation/rustfmt-once

permissions:
  contents: write

jobs:
  patch-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/claude-input-token-undercount
          fetch-depth: 0

      - name: Patch parser and regression test
        shell: bash
        run: echo '' | base64 -d | python3

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit parser fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/proxy/usage/parser.rs
          git commit -m "fix(usage): preserve zero-input Claude cache deltas"
          git push origin HEAD:fix/claude-input-token-undercount
