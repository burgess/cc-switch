name: Patch Claude Usage Tests Once

on:
  push:
    branches:
      - automation/rustfmt-once

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/claude-input-token-undercount
          fetch-depth: 0

      - name: Update coherent tuple fixtures
        shell: bash
        run: |
          FILE=src-tauri/src/proxy/usage/parser.rs
          perl -0pi -e 's/80_000 \+ 120_000 恰好还原 start 的 200_000/80_000 + 120_000 + 500 恰好还原 start 的 200_500/' "$FILE"
          perl -0pi -e 's/(fn test_claude_stream_prefers_coherent_corrected_delta_usage\(\).*?"input_tokens": )200_000,/${1}200_500,/s' "$FILE"
          perl -0pi -e 's/(fn test_claude_stream_rejects_incoherent_later_delta_after_correction\(\).*?"input_tokens": )200_000,/${1}200_500,/s' "$FILE"
          git diff -- "$FILE"

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit fixture correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/proxy/usage/parser.rs
          git commit -m "test(usage): align coherent cache tuple fixtures"
          git push origin HEAD:fix/claude-input-token-undercount
